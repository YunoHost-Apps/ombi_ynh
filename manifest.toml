#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "ombi"
name = "Ombi"
description.en = "Media request tool on Plex/Emby/Jellyfin"
description.fr = "Outil de demande de médias sur Plex/Emby/Jellyfin"

version = "4.53.10~ynh1"

maintainers = []

[upstream]
license = "GPL-2.0"
website = "https://ombi.io/"
demo = "https://app.ombi.io/landingpage"
admindoc = "https://docs.ombi.app/guides/installation/"
code = "https://github.com/Ombi-app/Ombi"
fund ="https://www.paypal.com/paypalme/PlexRequestsNet"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/ombi"
    
    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

        [resources.sources.main]
        amd64.url = "https://github.com/Ombi-app/Ombi/releases/download/v4.53.10/linux-x64.tar.gz"
        amd64.sha256 = "e2e69816455de02e3b672cc09b05ba8629d60dc9090244bde89f7ec7735a89cf"
        arm64.url = "https://github.com/Ombi-app/Ombi/releases/download/v4.53.10/linux-arm64.tar.gz"
        arm64.sha256 = "daf7968003ea61edc8f1ee26f891146fce26afa33d5baf863443bc96c9a19c48"
        armhf.url = "https://github.com/Ombi-app/Ombi/releases/download/v4.53.10/linux-arm.tar.gz"
        armhf.sha256 = "8a6d19eb7af6cf1a4ebbd444613bbf3b46ed5c51f41fd4f7db7422427422b987"

        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.arm64 = "linux-arm64\\.tar\\.gz"
        autoupdate.asset.amd64 = "linux-x64\\.tar\\.gz"
        autoupdate.asset.armhf = "linux-arm\\.tar\\.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    api.url = "/api"
    api.auth_header = false
    api.allowed = "visitors"
    api.show_tile = false
    api.protected = true

    login.url = "/login"
    login.auth_header = false
    login.show_tile = false

    [resources.ports]

    [resources.apt]
    packages = "mariadb-server"

    [resources.database]
    type = "mysql"
